<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Cronómetro de entrenamiento para finales de carabina aire ISSF.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Finales ISSF</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #101827;
      color: #f8fafc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
    }

    main {
      width: min(100%, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 7vw, 2.2rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 32px;
      color: #aab6c8;
      font-size: 1rem;
    }

    .status {
      min-height: 3.5rem;
      display: grid;
      place-items: center;
      margin: 0 0 12px;
      font-size: clamp(1.15rem, 5vw, 1.5rem);
      font-weight: 700;
    }

    .clock {
      margin: 4px 0 30px;
      color: #86efac;
      font-size: clamp(4.5rem, 23vw, 7.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 104px;
      border: 0;
      border-radius: 20px;
      padding: 18px 10px;
      color: white;
      font: inherit;
      font-size: clamp(1.15rem, 5vw, 1.5rem);
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .series { background: #1d4ed8; }
    .individual { background: #b91c1c; }

    .stop {
      width: 100%;
      min-height: 56px;
      margin-top: 12px;
      background: #334155;
      font-size: 1rem;
    }

    .voice-setting {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      color: #cbd5e1;
    }

    .voice-setting select {
      max-width: 70%;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #64748b;
      border-radius: 10px;
      background: #1e293b;
      color: #f8fafc;
      font: inherit;
    }

    .voice-setting select:disabled { opacity: 0.6; }
    .voice-setting select:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .hint {
      min-height: 2.8rem;
      margin: 20px 0 0;
      color: #aab6c8;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .install {
      display: none;
      min-height: 48px;
      margin: 14px auto 0;
      padding: 10px 18px;
      background: #0f766e;
      font-size: 1rem;
    }

    @media (max-height: 640px) {
      .subtitle { margin-bottom: 16px; }
      .clock { margin-bottom: 18px; }
      button { min-height: 78px; }
      .hint { margin-top: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Finales ISSF</h1>
    <p class="subtitle">Entrenador de finales de carabina aire</p>
    <p class="status" id="status" aria-live="polite">Pulsa un botón para comenzar</p>
    <div class="clock" id="clock" role="timer" aria-label="Tiempo transcurrido">--:--</div>
    <div class="buttons">
      <button class="series" id="series" type="button">Serie<br>(4:10)</button>
      <button class="individual" id="individual" type="button">Individual<br>(50 s)</button>
    </div>
    <button class="stop" id="stop" type="button">Parar</button>
    <div class="voice-setting">
      <label for="voice-language">Idioma de la voz</label>
      <select id="voice-language" aria-describedby="hint">
        <option value="es-ES">Español</option>
        <option value="en-GB">English</option>
      </select>
    </div>
    <p class="hint" id="hint" aria-live="polite">Elige el idioma antes de empezar. La voz depende del dispositivo; mantén esta pantalla abierta durante el ejercicio.</p>
    <button class="install" id="install" type="button">Instalar aplicación</button>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
